gui:
  # Enable Nerd Font v3 icons
  nerdFontsVersion: "3"
  # Make diff view side-by-side when screen is wide enough
  sideBySideDiff: true
  # Hide unneeded help/keybinding footers to maximize view space
  showBottomLine: false
  showCommandLog: false
  # Theme: Mafty Crimson Red & Gold
  theme:
    activeBorderColor:
      - "#f9e2af" # Mafty Gold for active panel border
      - "bold"
    inactiveBorderColor:
      - "#585b70" # Subtle grey for inactive borders
    optionsTextColor:
      - "#f38ba8" # Crimson Red for options/keybindings
    selectedLineBgColor:
      - "#313244" # Surface background highlight
    selectedRangeBgColor:
      - "#45475a"
    cherryPickedCommitBgColor:
      - "#f38ba8"
    cherryPickedCommitFgColor:
      - "#11111b"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f38ba8"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never # Uses delta if installed for rich diffs
  # Better commit graph format
  log:
    showGraph: "always"
    showWholeGraph: false
