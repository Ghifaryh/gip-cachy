general {
    lock_cmd = pidof hyprlock || hyprlock       
    before_sleep_cmd = loginctl lock-session    
    after_sleep_cmd = hyprctl dispatch dpms on  
    
    # Prevents idle timers from triggering while watching media/videos
    ignore_dbus_inhibit = false
}

# 1. 150s (2.5 mins): Dim the screen brightness
listener {
    timeout = 150                                 
    on-timeout = brightnessctl -s set 10%         
    on-resume = brightnessctl -r                 
}

# 2. 180s (3 mins): Lock the session (triggers hyprlock via lock_cmd)
listener {
    timeout = 180                                 
    on-timeout = loginctl lock-session
}

# 3. 210s (3.5 mins): Turn off display (30s after lock)
listener {
    timeout = 210
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. 600s (10 mins): Suspend laptop (Increased from 330s for stability)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
