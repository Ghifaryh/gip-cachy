general {
    no_fade_in = false
    grace = 2
    disable_loading = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/gip/.cache/current_wallpaper
    color = rgba(24, 24, 37, 1.0) # Catppuccin Mocha Base
    blur_passes = 3
    blur_size = 7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- CLOCK ---
label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244) # Catppuccin Text
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

# --- GREETING ---
label {
    monitor =
    text = Hi there, $USER
    color = rgb(205, 214, 244)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# --- UNIFIED BATTERY & CHARGING STATUS ---
label {
    monitor =
    text = cmd[update:2000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '100')% $([ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "1" ] && echo '󱐋')"
    color = rgba(166, 227, 161, 1.0) # Catppuccin Green
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgba(203, 166, 247, 0.5) # Catppuccin Mauve Border
    inner_color = rgba(30, 30, 46, 0.6)    # Catppuccin Mocha Surface
    font_color = rgb(205, 214, 244)
    
    # Validation / Error Colors
    check_color = rgba(249, 226, 175, 0.8) # Yellow during verification
    fail_color = rgba(243, 139, 168, 0.8)  # Red on wrong password
    capslock_color = rgba(250, 179, 135, 1.0) # Peach on Caps Lock
    
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -120
    halign = center
    valign = center
}
