general {
    no_fade_in = false
    grace = 2
    disable_loading = true
    ignore_empty_input = true
}

# ==========================================
# 1. SECOND MONITOR (HDMI-A-1): Pure Black
# ==========================================
# Place secondary monitor blackout FIRST so it gets assigned cleanly
background {
    monitor = HDMI-A-1
    color = rgba(0, 0, 0, 1.0)
}

# ==========================================
# 2. MAIN / LAPTOP MONITOR (eDP-1 or Default)
# ==========================================
# Leave monitor empty here so it acts as the primary background for eDP-1/active screen
background {
    monitor =
    path = /home/gip/.cache/current_wallpaper
    color = rgba(20, 15, 20, 1.0)
    blur_passes = 3
    blur_size = 7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- CLOCK ---
label {
    monitor = eDP-1
    text = $TIME
    color = rgb(243, 139, 168)
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

# --- GREETING ---
label {
    monitor = eDP-1
    text = Hi there, $USER
    color = rgb(205, 214, 244)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# --- UNIFIED BATTERY & CHARGING STATUS ---
label {
    monitor = eDP-1
    text = cmd[update:2000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '100')% $([ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "1" ] && echo '󱐋')"
    color = rgba(249, 226, 175, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor = eDP-1
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgba(249, 226, 175, 0.6)
    inner_color = rgba(20, 15, 20, 0.85)
    font_color = rgb(205, 214, 244)
    
    check_color = rgba(249, 226, 175, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    capslock_color = rgba(250, 179, 135, 1.0)
    
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -120
    halign = center
    valign = center
}
