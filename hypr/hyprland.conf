# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################



# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=,preferred,auto,auto
# monitor = eDP-1,2880x1800@90,0x0,1.5
monitor = eDP-1, 2880x1800@60, 0x0, 1.5
# monitor = HDMI-A-1,1920x1080@144,480x-1080,1 #kosan
# monitor = HDMI-A-1,1920x1080@144,0x-1080,1 #kosan
monitor = HDMI-A-1,1920x1080@75,1920x0,1 #lg me

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher


#################
### AUTOSTART ###
#################

# --- SYSTEM & ENVIRONMENT DAEMONS ---
# Import Hyprland environment into DBus/systemd for screen sharing & portals
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Force GTK/Qt applications to default to Dark Theme
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# --- UI & NOTIFICATIONS ---
exec-once = waybar
exec-once = hypridle
exec-once = swayosd-server
exec-once = swaync

# --- WALLPAPER DAEMON ---
# Chain daemon startup with restore to prevent race conditions (use swww or awww)
exec-once = swww-daemon || awww-daemon
exec-once = sleep 0.5 && (swww restore || awww restore)

# --- CLIPBOARD MANAGER ---
# Monitor text and image buffers with capped item limits
exec-once = wl-paste --type text --watch cliphist -max-items 500 store
exec-once = wl-paste --type image --watch cliphist -max-items 100 store

# rclone gdrive
# exec-once = rclone mount gdrive-work: ~/Gdrive/work --vfs-cache-mode full --vfs-cache-max-age 24h --vfs-write-back 5s --daemon

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Dual GPU setup
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# Desktop integration
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11

# --- UNIFIED QT WAYLAND SCALING ---
# Force Qt5 and Qt6 to use native Wayland protocols
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct

# Let Hyprland compositor handle scaling naturally for Qt apps
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_SCALE_FACTOR_ROUNDING_POLICY,PassThrough

# Prevent Qt from forcing desktop-DPI multiplier on top of Wayland
env = QT_ENABLE_HIGHDPI_SCALING,0
env = QT_SCALE_FACTOR,1

# Browser Wayland support
env = MOZ_ENABLE_WAYLAND,1

xwayland {
    force_zero_scaling = true
}

cursor {
    no_hardware_cursors = 2
    enable_hyprcursor = true
}

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
   # perfect 
    # gaps_in = 2
    # gaps_out = 2, 3, 3, 3
    gaps_in = 3
    gaps_out = 3, 4, 4, 4

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # default colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)

    #sazabi color
    col.active_border = rgba(f38ba8ee) rgba(fab387ee) 45deg
    col.inactive_border = rgba(181825aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    # rounding = 5
    rounding = 6
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    # shadow {
    #     enabled = true
    #     range = 4
    #     render_power = 3
    #     color = rgba(1a1a1aee)
    # }
    shadow {
      enabled = false  # Try this if it still feels 'heavy'
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    # blur {
    #     enabled = true
    #     size = 3
    #     passes = 1
    #
    #     vibrancy = 0.1696
    # }
    #
    blur {
        enabled = false
      }
}

# New syntax for Waybar blur
layerrule = blur off, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar

# Hyprland now uses 'animation' as a layerrule instead of 'transition'
layerrule = animation fade, match:namespace waybar

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    # This curve starts fast but settles much more "linearly" at the end
    # It avoids the long "trailing" slow-motion effect
    bezier = snap, 0.1, 1, 0.3, 1
    
    animation = windows, 1, 2, snap, slide
    animation = workspaces, 1, 3, snap, slide
    animation = windowsOut, 1, 2, snap, popin 80%
    animation = fade, 1, 2, snap
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
# ==========================================
# ✨ SMART GAPS (Dynamic Windows Rules)
# ==========================================

# When there is only 1 visible tiled window (w[tv1]), bump gaps up to 10
# workspace = w[tv1], gapsout:8 30 16 30, gapsin:10, rounding:10
windowrule {
    name = single-window-rounding
    match:float = false
    match:workspace = w[tv1]

    rounding = 5 # was 15
}

windowrule {
    name = multi-window-rounding
    match:float = false
    match:workspace = w[tv2-99]

    rounding = 5
}
# When an app is truly fullscreen (f[1]), remove all gaps completely
# workspace = f[1], gapsout:0, gapsin:0
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    # vfr = false

    # Add this line here to disable drag smoothing:
    animate_mouse_windowdragging = false
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# --- ESSENTIAL APPS & LAUNCHERS ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod SHIFT, B, exec, xdg-open "https://"
bind = $mainMod, O, exec, obsidian
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, ~/.config/rofi/launchers/type-6/launcher.sh
bind = $mainMod, PERIOD, exec, rofimoji --action copy --selector-args "-theme ~/.config/rofi/emoji.rasi" && sleep 0.1 && wtype -M ctrl v
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/launchers/type-6/style-1.rasi | cliphist decode | wl-copy && wtype -M ctrl v
bind = SHIFT, Print, exec, hyprshot -m region --clipboard-only

bind = $mainMod, N, exec, swaync-client -t -sw

# --- SESSION & POWER CONTROLS ---
# Manual Lock (Prevents fat-fingering $mainMod + Left arrow)
bind = $mainMod SHIFT, L, exec, loginctl lock-session

# Power Menu (wlogout)
bind = $mainMod, ESCAPE, exec, pkill wlogout || wlogout
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# --- WINDOW MANAGEMENT & LAYOUTS ---
# Cleaned Floating/Fullscreen toggles (No more overlapping $mainMod + F actions)
# bind = $mainMod, F, togglefloating,
# # Toggle floating AND immediately resize to 1600x1000 + center on screen
bind = $mainMod, F, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 1600 1000 && hyprctl dispatch centerwindow
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, C, centerwindow,  # Changed from 'F' to 'C' to avoid collision

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = SUPER SHIFT, X, layoutmsg, swapsplit

# Move focus (Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap windows (Shift + Arrow keys)
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

# Window Resizing
binde = $mainMod, EQUAL, resizeactive, 40 40
binde = $mainMod, MINUS, resizeactive, -40 -40
binde = $mainMod SHIFT, EQUAL, resizeactive, 0 -40
binde = $mainMod SHIFT, MINUS, resizeactive, 0 40

# --- WORKSPACES & SCRATCHPADS ---
# Switch workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# General Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Dedicated Tmux Scratchpad
workspace = special:scratchpad, on-created-empty:kitty tmux
bind = $mainMod, T, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, T, movetoworkspace, special:scratchpad

# Mouse bindings
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- HARDWARE & SYSTEM SCRIPTS ---
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/wbrestart.sh
bind = SUPER, F11, exec, ~/.config/hypr/scripts/hz_cycle.sh
bind = $mainMod, F12, exec, asusctl profile next && notify-send "ASUS Profile" "$(asusctl profile get | grep 'Active profile')" -i diagnostic

# Media / Brightness / Volume (SwayOSD & Playerctl)
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# --- MONITOR WORKSPACE ASSIGNMENTS ---
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = firefox-pip
    # Match props
    match:class = ^(firefox)$
    match:title = ^Picture-in-Picture$
    
    # Effects
    float = on
    pin = on

    animation = none

    size = 530 300
    # move = 1385 895
    move = 1380 830
}

windowrule {
    name = brave-pip
    # Brave leaves the class empty for PiP, so we match by title only
    match:title = ^Picture in picture$
    
    # Effects
    float = on
    pin = on
    animation = none

    # Your preferred dimensions
    size = 530 300
    move = 1380 830
}

windowrule {
    name = bitwarden-float
    # Match exact casing from your hyprctl output
    match:class = ^brave-nngceckbapebfimnlniiiahkandclblb-Default$
    
    # Effects
    float = on
    center = on
    pin = on
    dim_around = on
    stay_focused = on
    
    # Matching the exact case for Bitwarden
    # opacity = 0.8 0.8
    
    # Set size (important for popups)
    size = 480 700
}

windowrule = no_blur on, match:class firefox 

# windowrule = opacity 0.6 0.6, match:float true
windowrule = opacity 0.8 0.8, match:class kitty

# bluetui & impala
windowrule = float on, match:class ^(impala-float|bluetui-float)$
windowrule = size 900 600, match:class ^(impala-float|bluetui-float)$
windowrule = center on, match:class ^(impala-float|bluetui-float)$
windowrule = pin on, match:class ^(impala-float|bluetui-float)$
windowrule = dim_around on, match:class ^(impala-float|bluetui-float)$
windowrule = stay_focused on, match:class ^(impala-float|bluetui-float)$
windowrule = opacity 0.8 0.8, match:class ^(impala-float|bluetui-float)$

# Volume Control & File Pickers
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|xdg-desktop-portal-gtk)$
windowrule = size 900 600, match:class ^(org.pulseaudio.pavucontrol|xdg-desktop-portal-gtk)$
windowrule = center on, match:class ^(org.pulseaudio.pavucontrol|xdg-desktop-portal-gtk)$
windowrule = pin on, match:class ^(org.pulseaudio.pavucontrol|xdg-desktop-portal-gtk)$
windowrule = dim_around on, match:class ^(org.pulseaudio.pavucontrol|xdg-desktop-portal-gtk)$
windowrule = stay_focused on, match:class ^(org.pulseaudio.pavucontrol|xdg-desktop-portal-gtk)$

# Polkit Authentication Agent
windowrule = float on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent)$
windowrule = center on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent)$
windowrule = pin on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent)$
windowrule = stay_focused on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent)$

# Full Bluetooth Manager
windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 800 500, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

# Catch common dialog titles
windowrule = float on, match:title ^(Confirm to replace files|File Operation Progress|Authentication Required)$

#zoom
# Zoom Workplace rules
windowrule {
    name = zoom-main-tile
    match:class = ^(zoom)$
    match:title = ^(Zoom Meeting|Zoom Workplace)$

    float = false
}

windowrule {
    name = zoom-popups-float
    match:class = ^(zoom)$
    match:title = ^(Settings|Participants|Chat|Meeting Information|Breakout Rooms|Select a window)$

    float = on
    center = on
}

group {
    col.border_active = rgba(89b4faee)      # Active group border (Catppuccin Blue)
    col.border_inactive = rgba(313244aa)    # Inactive group border

    groupbar {
        enabled = true                      # Set false if you don't want the top tab bar visible
        font_size = 10
        gradients = false
        col.active = rgba(89b4faee)
        col.inactive = rgba(313244aa)
        text_color = rgba(cdd6f4ff)
    }
}
