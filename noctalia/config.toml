# Noctalia v5 config translated from nullveilheim.
# On Cachy this file belongs at ~/.config/noctalia/config.toml.
# Copy plugins/ next to it. See README.md.
# A GUI override in ~/.local/state/noctalia/settings.toml wins over this file.

[accessibility]
ui_scale = 1.0
high_contrast = false

[shell]
corner_radius_scale = 1.0
font_family = "Inter"
time_format = "{:%H:%M}"
date_format = "%A, %x"
polkit_agent = true
show_location = true
clipboard_auto_paste = "auto"

[shell.screen_corners]
enabled = true
size = 22

[shell.screenshot]
save_to_file = true
copy_to_clipboard = true
freeze_screen = true
confirm_region = true
remember_last_region = false
show_cursor = false
annotate = false
skip_annotate_on_copy_save = false
close_on_copy = true
close_on_save = true

[shell.panel]
transparency_mode = "soft"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"
launcher_placement = "attached"
clipboard_placement = "attached"
open_near_click_control_center = true
open_near_click_launcher = true
open_near_click_clipboard = true
open_near_click_wallpaper = true
open_near_click_session = true

[shell.launcher]
layout = "simple"
search_position = "top"
default_view = "all"
app_grid = false
compact = false
categories = false
show_icons = true
show_app_origin_indicator = true
fetch_exchange_rates = true
provider_prefix = "/"
auto_paste = "auto"

[shell.window_switcher]
style = "carousel"

[theme]
mode = "dark"
shell_mode = "follow"
source = "wallpaper"
builtin = "Nord"
wallpaper_scheme = "m3-monochrome"

# Left off so this does not fight swww. Set a directory, then enabled = true.
[wallpaper]
enabled = false
fill_mode = "fit"
transition = ["disc", "zoom", "honeycomb"]
transition_duration = 1500
edge_smoothness = 0.3
transition_on_startup = false
directory = ""

[wallpaper.automation]
enabled = false

[notification]
enable_daemon = true
show_app_name = true
show_actions = true
layer = "top"
position = "top_right"
background_opacity = 0.9
offset_x = 8
offset_y = 8

[osd]
position = "top_center"
position_vertical = "top_center"
scale = 1.0
background_opacity = 0.9
border = true
offset_x = 8
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
media = true
privacy = true
keyboard_backlight = true

# Visual settings from the Nix lock screen. Disabled so loginctl still
# reaches hyprlock. Set enabled = true when you want Noctalia to lock.
# The Nix lock widgets were placed on a 1920x1080 canvas and are not copied.
[lockscreen]
enabled = false
lock_before_suspend = true
fingerprint = true
allow_empty_password = false
blurred_desktop = false
transition_duration = 1500
edge_smoothness = 0.3
blur_intensity = 0.5
tint_intensity = 0.3
transition = ["disc", "zoom", "honeycomb"]

[control_center]
sidebar = "compact"

[control_center.calendar]
show_events_card = true
show_week_numbers = false

[bar]
order = ["main"]

[bar.main]
enabled = true
position = "top"
layer = "top"
auto_hide = false
smart_auto_hide = false
show_on_workspace_switch = true
reserve_space = true
thickness = 36
background_opacity = 0.9
border = "outline_variant"
border_width = 0.0
shadow = true
contact_shadow = false
panel_overlap = 1
radius = 12
radius_top_left = 12
radius_top_right = 12
radius_bottom_left = 12
radius_bottom_right = 12
margin_edge = 0
margin_ends = 400
padding = 4
widget_spacing = 4
hover_highlight = true
scale = 1.2
font_family = "Inter"
font_weight = 400
capsule = true
capsule_fill = "surface_container"
capsule_thickness = 0.78
capsule_radius = 8
capsule_opacity = 0.9
start = [
  "launcher",
  "workspaces",
  "clock",
  "k4n4t4/hypr-submap:hypr-submap",
]
center = ["media"]
end = [
  "tray",
  "notifications",
  "wallpaper",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "session",
]

[bar.main.dead_zone.actions]
left = "panel-toggle control-center"
right = "settings-toggle"

[widget.launcher]
custom_image = "/home/gip/.config/waybar/Mafty-new-new.svg"

[widget.workspaces]
style = "regular"
pill_scale = 1.0
active_pill_size = 1.0
inactive_pill_size = 1.0

[widget.clock]
format = "{:%H:%M}"

[widget.media]
album_art_only = false
hide_when_no_media = true
scale = 1.0
font_scale = 0.7
min_length = 50
max_length = 150

[widget.tray]
drawer = true
drawer_columns = 3
detached_panel = true
hide_passive = true

[widget.notifications]
hide_when_no_unread = false

[widget.network]
show_label = false
show_vpn_label = false

[widget.bluetooth]
show_label = false

[widget.volume]
show_label = false

[widget.brightness]
show_label = false

[widget.battery]
display_mode = "glyph"
show_label = false
label_content = "percent"

[widget."k4n4t4/hypr-submap:hypr-submap"]
hide_when_default = true
glyph = "keyboard"

[dock]
enabled = true
position = "bottom"
icon_size = 28
radius = 12
radius_top_left = 12
radius_top_right = 12
radius_bottom_left = 12
radius_bottom_right = 12
main_axis_padding = 4
cross_axis_padding = 4
item_spacing = 4
margin_ends = 0
margin_edge = 4
background_opacity = 0.9
shadow = true
show_running = true
auto_hide = false
reserve_space = true
magnification = false
active_scale = 1.0
inactive_scale = 1.0
active_opacity = 1.0
inactive_opacity = 1.0
launcher_position = "start"
launcher_custom_image = "/home/gip/.config/waybar/Mafty-new-new.svg"
pinned = ["brave-browser-nightly", "com.mitchellh.ghostty"]

[plugins]
enabled = [
  "oldirtty/color_picker",
  "k4n4t4/hypr-submap",
  "syaikhu/hypr-cheatsheet",
]
auto_update = "all"

[[plugins.source]]
name = "local"
kind = "path"
location = "~/.config/noctalia/plugins"
enabled = true

[plugin_settings."oldirtty/color_picker"]
picker_tool = "hyprpicker"
main-colorspace = "hex"
lowercase-hex = false

[plugin_settings."syaikhu/hypr-cheatsheet"]
config_type = "lua"
config = "~/.config/hypr/hyprland.lua"
columns = 3
show_undescribed = false
